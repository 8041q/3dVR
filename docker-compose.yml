services:
  web:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the HTTPS public URL}
      APP_DYNAMIC_HOSTS: ${APP_DYNAMIC_HOSTS:-1}
      APP_PUBLIC_HOSTS: ${APP_PUBLIC_HOSTS:-}
      APP_TRUSTED_ORIGINS: ${APP_TRUSTED_ORIGINS:-}
      VR_STORAGE_ROOT: /app/storage
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./storage/security:/app/storage/security
      - ./storage/data:/app/storage/data
      - ./storage/public:/app/storage/public
      - ./storage/incoming:/app/storage/incoming
      - ./storage/masters:/app/storage/masters
      - ./storage/jobs:/app/storage/jobs
      - ./storage/panoramas:/app/storage/panoramas
      - ./storage/thumbnails:/app/storage/thumbnails
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
  worker:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VR_STORAGE_ROOT: /app/storage
    command: ["node", "server/panoramaWorker.js"]
    network_mode: none
    volumes:
      - ./storage/masters:/app/storage/masters:ro
      - ./storage/jobs:/app/storage/jobs
      - ./storage/panoramas:/app/storage/panoramas
      - ./storage/work:/app/storage/work
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
