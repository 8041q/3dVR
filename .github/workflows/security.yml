name: Security and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    container: node:${{ matrix.node }}-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - name: Check public build excludes runtime data
        run: test ! -d dist/uploads && test ! -d dist/storage && test ! -f dist/.env
      - name: Check tracked runtime paths
        run: test -z "$(git ls-files .env storage server/data public/uploads | sed '/^public\/uploads\/.gitkeep$/d')"
